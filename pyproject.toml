[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-app"
version = "0.1.0"
description = "Importable NLP analysis helpers extracted from the project notebook."
requires-python = ">=3.9"
dependencies = ["nltk", "pandas", "numpy"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "nbmake"]

[tool.setuptools.packages.find]
include = ["nlp_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "wordnet: test requires the WordNet corpus (skipped if unavailable)",
]
