name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Pre-download NLTK corpora
        run: python -m nltk.downloader gutenberg inaugural wordnet omw-1.4
      - name: Run tests with coverage
        run: pytest --cov=nlp_app --cov-report=term-missing --cov-fail-under=70
      - name: Notebook execution smoke test
        run: pytest --nbmake "NLP AI Application.ipynb"
